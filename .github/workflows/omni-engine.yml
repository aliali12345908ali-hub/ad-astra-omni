name: Ad Astra Omni Engine

on:
  schedule:
    - cron: '0 */6 * * *'  # تشغيل كل 6 ساعات أوتوماتيكياً
  workflow_dispatch:      # إمكانية التشغيل اليدوي الفوري

permissions:
  contents: write         # منح الصلاحية الكاملة لتعديل ورفع الملفات

jobs:
  run-omni:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Sovereign Omni Intelligence
        run: |
          python main.py
